{{- if .Values.drivers.amd.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hami-dra-amd-driver-kubelet-plugin
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      hami-dra-driver-component: amd-kubelet-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: hami-dra-driver
        app.kubernetes.io/name: hami-dra-amd-driver
        hami-dra-driver-component: amd-kubelet-plugin
    spec:
      {{- include "hami.dra.driver.amd.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.drivers.amd.daemonSet.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drivers.amd.daemonSet.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.drivers.amd.daemonSet.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: system-node-critical
      serviceAccountName: hami-dra-driver-service-account
      initContainers:
      - name: driver-init
        image: {{ include "hami.dra.driver.amd.image" . }}
        imagePullPolicy: {{ .Values.drivers.amd.image.pullPolicy | default "IfNotPresent" }}
        command: ["sh", "-c", "while [ ! -d /sys/class/kfd ] || [ ! -d /sys/module/amdgpu/drivers/ ]; do echo 'amdgpu driver is not loaded'; sleep 2; done"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: sys
          mountPath: /sys
      containers:
      - name: plugin
        image: {{ include "hami.dra.driver.amd.image" . }}
        imagePullPolicy: {{ .Values.drivers.amd.image.pullPolicy | default "IfNotPresent" }}
        command: ["gpu-kubeletplugin"]
        securityContext:
          privileged: true
        env:
        - name: CDI_ROOT
          value: /var/run/cdi
        - name: KUBELET_REGISTRAR_DIRECTORY_PATH
          value: /var/lib/kubelet/plugins_registry
        - name: KUBELET_PLUGINS_DIRECTORY_PATH
          value: /var/lib/kubelet/plugins
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: FEATURE_GATES
          value: GPUSharing=true
        {{- with .Values.drivers.amd.vgpuHookHostPath }}
        - name: VGPU_HOOK_HOST_PATH
          value: {{ . | quote }}
        {{- end }}
        volumeMounts:
        - name: plugins-registry
          mountPath: /var/lib/kubelet/plugins_registry
        - name: plugins
          mountPath: /var/lib/kubelet/plugins
        - name: cdi
          mountPath: /var/run/cdi
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
        {{- with .Values.drivers.amd.vgpuHookHostPath }}
        - name: vgpu-hook
          mountPath: {{ dir . | quote }}
        {{- end }}
      volumes:
      - name: plugins-registry
        hostPath:
          path: /var/lib/kubelet/plugins_registry
      - name: plugins
        hostPath:
          path: /var/lib/kubelet/plugins
      - name: cdi
        hostPath:
          path: /var/run/cdi
      - name: dev
        hostPath:
          path: /dev
      - name: sys
        hostPath:
          path: /sys
      {{- with .Values.drivers.amd.vgpuHookHostPath }}
      - name: vgpu-hook
        hostPath:
          path: {{ dir . | quote }}
          type: DirectoryOrCreate
      {{- end }}
{{- end }}
