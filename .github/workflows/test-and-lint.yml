name: Test and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.11+auto
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: make test

      - name: Run tests with coverage
        run: make test-coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  lint:
    name: Run Linter
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.11+auto
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        run: make lint

  helm-template:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Render chart with fake driver enabled
        run: |
          helm template hami-dra ./charts/hami-dra \
            --set drivers.fake.enabled=true \
            --set drivers.nvidia.enabled=false \
            | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          role = next(d for d in docs if d.get("kind") == "ClusterRole" and d["metadata"]["name"] == "hami-dra-driver-clusterrole")
          assert not [r for r in role["rules"] if r.get("resources") == ["pods"]], "pods rule must stay NVIDIA-only"
          print("fake-only render: driver ClusterRole has no pods rule")
          '

      - name: Check the fake Hygon profile matches the webhook device type
        run: |
          helm template hami-dra ./charts/hami-dra \
            --set drivers.fake.enabled=true \
            --set drivers.fake.profile=hygon \
            --set drivers.nvidia.enabled=false \
            --set 'deviceVendors={hygon}' \
            | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          dc = next(d for d in docs if d.get("kind") == "DeviceClass")
          expr = dc["spec"]["selectors"][0]["cel"]["expression"]
          assert expr.endswith(".type == \"hcu\""), expr
          cm = next(d for d in docs if d.get("kind") == "ConfigMap" and "fake" in d["metadata"]["name"])
          types = {dev["attributes"]["type"]["string"] for data in cm["data"].values() for g in yaml.safe_load(data)["groups"] for dev in g["devices"]}
          assert types == {"hcu"}, types
          print("fake Hygon render: DeviceClass and devices use type hcu")
          '

      - name: Check driver pods RBAC with NVIDIA driver enabled
        run: |
          helm template hami-dra ./charts/hami-dra \
            --set drivers.nvidia.enabled=true \
            --set drivers.fake.enabled=false \
            | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          role = next(d for d in docs if d.get("kind") == "ClusterRole" and d["metadata"]["name"] == "hami-dra-driver-clusterrole")
          pods = [r for r in role["rules"] if r.get("resources") == ["pods"]]
          assert pods, "driver ClusterRole is missing the pods rule"
          assert pods[0]["verbs"] == ["get", "list", "watch", "patch"], pods[0]["verbs"]
          print("NVIDIA-enabled render: pods get/list/watch/patch present in driver ClusterRole")
          '

  helm-chart-test:
    name: Helm Chart Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false --check-version-increment=false

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: hami-dra-e2e
          node_image: kindest/node:v1.37.0

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 120s

      - name: Wait for cert-manager to be ready
        run: |
          kubectl wait --for=condition=available --timeout=120s \
            deployment/cert-manager -n cert-manager
          kubectl wait --for=condition=available --timeout=120s \
            deployment/cert-manager-webhook -n cert-manager

      - name: Run chart-testing (install)
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

  multi-vendor-e2e:
    name: Multi-vendor fake device E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build E2E images
        run: |
          docker buildx build --load -t hami-dra-webhook:e2e -f docker/hami-dra-webhook/Dockerfile .
          docker buildx build --load -t hami-dra-fake-driver:e2e -f docker/hami-dra-fake-driver/Dockerfile .

      - name: Create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: hami-dra-e2e
          node_image: kindest/node:v1.37.0

      - name: Load E2E images
        run: |
          kind load docker-image --name hami-dra-e2e hami-dra-webhook:e2e
          kind load docker-image --name hami-dra-e2e hami-dra-fake-driver:e2e

      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set crds.enabled=true --wait --timeout 180s

      - name: Run multi-vendor E2E
        run: bash test/e2e/run.sh

  security-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
