apiVersion: v1
kind: Namespace
metadata:
  name: hami-dra-e2e
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fake-driver
  namespace: hami-dra-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hami-dra-e2e-fake-driver
rules:
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims, resourceslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims/status]
    verbs: [update, patch]
  - apiGroups: [resource.k8s.io]
    resources: [resourceclaims/driver]
    verbs: ["associated-node:update", "associated-node:patch"]
  - apiGroups: [""]
    resources: [configmaps, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hami-dra-e2e-fake-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hami-dra-e2e-fake-driver
subjects:
  - kind: ServiceAccount
    name: fake-driver
    namespace: hami-dra-e2e
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-nvidia
  namespace: hami-dra-e2e
data:
  config.yaml: |
    groups:
      - name: nvidia
        devices:
          - name: nvidia-0
            attributes:
              type: {string: hami-gpu}
              uuid: {string: GPU-FAKE-0}
              productName: {string: FAKE-NVIDIA}
            capacity:
              cores: {value: "100"}
              memory: {value: 80Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-hygon
  namespace: hami-dra-e2e
data:
  config.yaml: |
    groups:
      - name: hygon
        devices:
          - name: hygon-0
            attributes:
              type: {string: hcu}
              uuid: {string: HCU-FAKE-0}
              productName: {string: K100_AI}
            capacity:
              cores: {value: "120"}
              memory: {value: 64Gi}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-ascend
  namespace: hami-dra-e2e
data:
  config.yaml: |
    groups:
      - name: ascend
        devices:
          - name: ascend-0
            attributes:
              type: {string: HAMivNPUCore}
              uuid: {string: ASCEND-FAKE-0}
              productName: {string: Ascend310P}
            capacity:
              cores: {value: "8"}
              memory: {value: 24Gi}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-drivers
  namespace: hami-dra-e2e
spec:
  selector:
    matchLabels: {app: hami-dra-e2e-fake-drivers}
  template:
    metadata:
      labels: {app: hami-dra-e2e-fake-drivers}
    spec:
      serviceAccountName: fake-driver
      containers:
        - name: nvidia
          image: hami-dra-fake-driver:e2e
          imagePullPolicy: Never
          args: &commonArgs
            - --node-name=$(NODE_NAME)
            - --driver-name=hami-core-gpu.project-hami.io
            - --configmap-name=fake-nvidia
            - --configmap-namespace=hami-dra-e2e
            - --configmap-key=config.yaml
            - --kubelet-registrar-directory-path=/var/lib/kubelet/plugins_registry
            - --kubelet-plugins-directory-path=/var/lib/kubelet/plugins
          env: &nodeEnv
            - name: NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
          volumeMounts: &pluginMounts
            - {name: registry, mountPath: /var/lib/kubelet/plugins_registry}
            - {name: plugins, mountPath: /var/lib/kubelet/plugins}
        - name: hygon
          image: hami-dra-fake-driver:e2e
          imagePullPolicy: Never
          args:
            - --node-name=$(NODE_NAME)
            - --driver-name=dra.hygon.com
            - --configmap-name=fake-hygon
            - --configmap-namespace=hami-dra-e2e
            - --configmap-key=config.yaml
            - --kubelet-registrar-directory-path=/var/lib/kubelet/plugins_registry
            - --kubelet-plugins-directory-path=/var/lib/kubelet/plugins
          env: *nodeEnv
          volumeMounts: *pluginMounts
        - name: ascend
          image: hami-dra-fake-driver:e2e
          imagePullPolicy: Never
          args:
            - --node-name=$(NODE_NAME)
            - --driver-name=ascend.project-hami.io
            - --configmap-name=fake-ascend
            - --configmap-namespace=hami-dra-e2e
            - --configmap-key=config.yaml
            - --kubelet-registrar-directory-path=/var/lib/kubelet/plugins_registry
            - --kubelet-plugins-directory-path=/var/lib/kubelet/plugins
          env: *nodeEnv
          volumeMounts: *pluginMounts
      volumes:
        - name: registry
          hostPath: {path: /var/lib/kubelet/plugins_registry, type: DirectoryOrCreate}
        - name: plugins
          hostPath: {path: /var/lib/kubelet/plugins, type: DirectoryOrCreate}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: hami-core-gpu.project-hami.io
spec:
  selectors:
    - cel:
        expression: device.driver == "hami-core-gpu.project-hami.io" && device.attributes["hami-core-gpu.project-hami.io"].type == "hami-gpu"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dra.hygon.com
spec:
  selectors:
    - cel:
        expression: device.driver == "dra.hygon.com" && device.attributes["dra.hygon.com"].type == "hcu"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: hami-vnpu-core.project-hami.io
spec:
  selectors:
    - cel:
        expression: device.driver == "ascend.project-hami.io" && device.attributes["ascend.project-hami.io"].type == "HAMivNPUCore"
