apiVersion: v1
kind: Namespace
metadata:
  name: hami-dra-workloads
---
apiVersion: v1
kind: Pod
metadata:
  name: multi-vendor
  namespace: hami-dra-workloads
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10
      resources:
        limits:
          nvidia.com/gpu: "1"
          hygon.com/hcunum: "1"
          huawei.com/Ascend310P: "1"
---
apiVersion: v1
kind: Pod
metadata:
  name: no-device
  namespace: hami-dra-workloads
spec:
  restartPolicy: Never
  containers:
    - name: workload
      image: registry.k8s.io/pause:3.10
